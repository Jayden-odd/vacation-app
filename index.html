<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴가 관리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- FullCalendar CDN -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
  <style>
    /* 휴가 유형별 색상 클래스 */
    .fc-event.vacation-admin {
      background-color: #9333ea !important; /* 보라색 (관리자) */
      border-color: #7e22ce !important;
      color: #ffffff !important;
    }
    .fc-event.vacation-equipment {
      background-color: #16a34a !important; /* 녹색 (장비) */
      border-color: #15803d !important;
      color: #ffffff !important;
    }
    .fc-event.vacation-picking {
      background-color: #2563eb !important; /* 파란색 (피킹) */
      border-color: #1d4ed8 !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- 헤더 영역 -->
  <header class="bg-white dark:bg-gray-800 shadow-sm border-b dark:border-gray-700 p-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold tracking-tight">📅 휴가 관리 시스템</h1>
      
      <!-- 다크모드 토글 버튼 -->
      <button id="btn-theme-toggle" class="px-2.5 py-1.5 text-xs font-medium rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-1">
        <span id="theme-icon">🌙</span> <span id="theme-text">야간 모드</span>
      </button>
    </div>

    <!-- 네비게이션 / 인증 영역 -->
    <div id="auth-container">
      <!-- 비로그인 상태 -->
      <div id="auth-buttons" class="space-x-2">
        <button id="btn-open-login" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">로그인</button>
        <button id="btn-open-register" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white rounded-lg text-sm font-medium hover:bg-gray-300 dark:hover:bg-gray-600">회원가입</button>
      </div>

      <!-- 로그인 상태 -->
      <div id="user-menu" class="hidden flex items-center space-x-3">
        <span id="user-info-text" class="text-sm font-medium text-gray-700 dark:text-gray-300"></span>
        <button id="btn-open-mypage" class="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 text-sm rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600">내 정보</button>
        <button id="btn-open-admin" class="hidden px-3 py-1.5 bg-purple-600 text-white text-sm rounded-lg hover:bg-purple-700">관리자 설정</button>
        <button id="btn-logout" class="px-3 py-1.5 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600">로그아웃</button>
      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 (캘린더 및 필터) -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col">
    
    <!-- 필터 바 (그룹 및 사용자 선택) -->
    <div class="mb-4 flex flex-wrap items-center gap-3 bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm border dark:border-gray-700">
      
      <!-- 관리자 전용 그룹 필터 -->
      <div id="admin-group-filter-container" class="flex items-center gap-2">
        <select id="admin-group-filter" class="hidden border rounded-lg px-3 py-1.5 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
          <option value="ALL">전체 그룹</option>
        </select>
      </div>

      <!-- 관리자/매니저 전용 사용자 필터 -->
      <div id="admin-filter-container" class="hidden flex items-center gap-2">
        <select id="admin-user-filter" class="border rounded-lg px-3 py-1.5 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
          <option value="WORKING_ONLY">💼 [근무자 보기]</option>
          <option value="ALL">전체 휴가 보기</option>
        </select>
      </div>

      <!-- 일반 사용자 전용 필터 -->
      <div id="user-filter-container" class="hidden flex items-center gap-2">
        <label class="text-sm flex items-center gap-1.5 cursor-pointer select-none">
          <input type="checkbox" id="my-vacation-only" class="rounded border-gray-300 dark:border-gray-600"> 내 휴가만 보기
        </label>
      </div>
    </div>

    <!-- 캘린더 컴포넌트 -->
    <div class="bg-white dark:bg-gray-800 shadow-sm rounded-xl p-4 sm:p-6 border dark:border-gray-700 flex-1 flex flex-col">
      <div id="calendar" class="flex-1"></div>
    </div>
  </main>

  <!-- ================= 모달 팝업 모음 ================= -->

  <!-- 1. 로그인 모달 -->
  <div id="login-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 w-full max-w-sm shadow-xl border dark:border-gray-700">
      <h2 class="text-lg font-bold mb-4">로그인</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1">전화번호 (아이디)</label>
          <input type="text" id="login-id" required class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="'-' 제외 입력">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">비밀번호</label>
          <input type="password" id="login-password" required class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
        <div class="flex justify-between items-center text-xs">
          <button type="button" id="btn-reset-password-login" class="text-blue-600 dark:text-blue-400 hover:underline">비밀번호 초기화</button>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" class="btn-close-modal px-4 py-2 bg-gray-200 dark:bg-gray-700 text-sm rounded-lg" data-target="login-modal">취소</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">로그인</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. 회원가입 모달 -->
  <div id="register-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 w-full max-w-sm shadow-xl border dark:border-gray-700">
      <h2 class="text-lg font-bold mb-4">회원가입</h2>
      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1">전화번호 (로그인 ID로 사용)</label>
          <input type="text" id="reg-phone" required class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="'-' 제외 입력">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">이름</label>
          <input type="text" id="reg-name" required class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">비밀번호</label>
          <input type="password" id="reg-password" required class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">직무 선택</label>
          <select id="reg-job" class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option value="관리자">관리자 (보라색)</option>
            <option value="장비">장비 (녹색)</option>
            <option value="피킹" selected>피킹 (파란색)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">그룹 선택</label>
          <select id="reg-group" class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <!-- 동적 로드 -->
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" class="btn-close-modal px-4 py-2 bg-gray-200 dark:bg-gray-700 text-sm rounded-lg" data-target="register-modal">취소</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">가입하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. 휴가 신청/관리 모달 -->
  <div id="vacation-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 w-full max-w-sm shadow-xl border dark:border-gray-700">
      <h2 id="vacation-modal-date" class="text-lg font-bold mb-2">휴가 설정</h2>
      <p id="vacation-modal-desc" class="text-sm text-gray-600 dark:text-gray-400 mb-4">선택하신 날짜에 휴가를 신청하시겠습니까?</p>
      
      <div id="vacation-target-info" class="hidden mb-4 p-2.5 bg-gray-100 dark:bg-gray-700 rounded-lg text-xs"></div>

      <div class="flex justify-end space-x-2">
        <button type="button" class="btn-close-modal px-4 py-2 bg-gray-200 dark:bg-gray-700 text-sm rounded-lg" data-target="vacation-modal">닫기</button>
        <button id="btn-vacation-apply" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">휴가 신청</button>
        <button id="btn-vacation-cancel" class="hidden px-4 py-2 bg-red-600 text-white text-sm rounded-lg hover:bg-red-700">휴가 취소</button>
      </div>
    </div>
  </div>

  <!-- 4. 내 정보 수정 모달 -->
  <div id="mypage-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 w-full max-w-sm shadow-xl border dark:border-gray-700">
      <h2 class="text-lg font-bold mb-4">내 정보 수정</h2>
      <form id="mypage-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1">이름</label>
          <input type="text" id="my-name" disabled class="w-full border rounded-lg p-2 text-sm bg-gray-100 dark:bg-gray-700 dark:text-gray-400 cursor-not-allowed">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">직무 변경</label>
          <select id="my-job" class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option value="관리자">관리자 (보라색)</option>
            <option value="장비">장비 (녹색)</option>
            <option value="피킹">피킹 (파란색)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">그룹 변경</label>
          <select id="my-group" class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <!-- 동적 로드 -->
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">새 비밀번호 (변경시에만 입력)</label>
          <input type="password" id="my-password" class="w-full border rounded-lg p-2 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="변경 안 하려면 공백 유지">
        </div>
        
        <div class="flex justify-between items-center pt-1">
          <button type="button" id="btn-reset-mypw" class="text-xs text-amber-600 dark:text-amber-400 hover:underline">비밀번호를 핸드폰 번호로 초기화</button>
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" class="btn-close-modal px-4 py-2 bg-gray-200 dark:bg-gray-700 text-sm rounded-lg" data-target="mypage-modal">취소</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 5. 관리자 설정 모달 -->
  <div id="admin-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 w-full max-w-4xl shadow-xl border dark:border-gray-700 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">시스템 관리자 설정</h2>
        <button type="button" class="btn-close-modal text-gray-500 hover:text-gray-700 text-xl font-bold" data-target="admin-modal">&times;</button>
      </div>

      <!-- 그룹 관리 영역 (최고관리자 전용) -->
      <div id="admin-group-create-sec" class="mb-4 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg border dark:border-gray-700 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex items-center gap-2">
          <input type="text" id="new-group-name" placeholder="새 그룹명 입력" class="border rounded px-3 py-1.5 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
          <button type="button" id="btn-create-group" class="px-3 py-1.5 bg-green-600 text-white rounded text-sm hover:bg-green-700">그룹 생성</button>
        </div>
        <div class="flex items-center gap-2">
          <select id="delete-group-select" class="border rounded px-3 py-1.5 text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <!-- 동적 로드 -->
          </select>
          <button type="button" id="btn-delete-group" class="px-3 py-1.5 bg-red-600 text-white rounded text-sm hover:bg-red-700">그룹 삭제</button>
        </div>
      </div>

      <!-- 사용자 목록 테이블 영역 -->
      <div class="flex-1 overflow-y-auto border rounded-lg dark:border-gray-700">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-gray-700 dark:text-gray-300 sticky top-0">
            <tr>
              <th class="p-2 border">이름</th> <!-- 수정: 이름만 표시 -->
              <th class="p-2 border">전화번호</th>
              <th class="p-2 border">직무</th>
              <th class="p-2 border">그룹</th>
              <th class="p-2 border">권한</th>
              <th class="p-2 border text-center">관리</th>
            </tr>
          </thead>
          <tbody id="admin-user-table-body">
            <!-- 동적 로드 -->
          </tbody>
        </table>
      </div>

      <div class="flex justify-end pt-4">
        <button type="button" class="btn-close-modal px-4 py-2 bg-gray-200 dark:bg-gray-700 text-sm rounded-lg" data-target="admin-modal">닫기</button>
      </div>
    </div>
  </div>

  <!-- 메인 스크립트 연결 -->
  <script type="module" src="script.js"></script>
</body>
</html>
